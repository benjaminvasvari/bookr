<div class="image-upload-form">
  <div class="form-description">
    <p>Tölts fel egy főképet a vállalkozásodhoz (opcionális). A lépés kihagyható.</p>
  </div>

  <div class="images-section">
    <label>Főkép <span class="optional">(opcionális)</span></label>

    <div class="slots-container">
      <div class="slot slot-main">
        @if (mainImagePreview) {
          <img [src]="mainImagePreview" alt="Főkép" class="slot-img" />
          <div class="slot-overlay">
            <button type="button" class="slot-delete" (click)="deleteImage()" title="Törlés">
              <i class="fas fa-trash-alt"></i> Törlés
            </button>
            <button type="button" class="slot-edit" (click)="triggerFileInput()" title="Módosítás">
              <i class="fas fa-edit"></i> Csere
            </button>
          </div>
        } @else {
          <div class="slot-empty" (click)="triggerFileInput()">
            <i class="fas fa-image"></i>
            <span>FŐKÉP FELTÖLTÉSE</span>
          </div>
        }

        <input
          id="file-input-main"
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
          class="hidden-input"
        />
      </div>
    </div>

    <div class="images-info">
      <i class="fas fa-info-circle"></i>
      <span>A főképet most kihagyhatod, később a beállításokban is feltölthető vagy cserélhető.</span>
    </div>
  </div>
</div>

<app-image-crop-modal
  [visible]="showCropModal"
  [imageFile]="cropSourceFile"
  title="Kep kivagasa"
  [maintainAspectRatio]="false"
  [roundCropper]="false"
  (cancel)="closeCropModal()"
  (apply)="applyCrop($event)"
></app-image-crop-modal>
