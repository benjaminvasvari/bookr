<section class="page">
  <header class="page-header">
    <div>
      <h1>Tulajdonosok</h1>
      <p>Tulajdonos felhasználók és cég hozzárendelések.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" type="button" (click)="onInviteOwner()">Tulajdonos meghívás</button>
      <button class="btn btn-secondary" type="button" (click)="onAuditRoles()">Szerep audit</button>
    </div>
  </header>

  <div class="table-card">
    <div class="table-head">
      <span>Név</span>
      <span>Cég</span>
      <span>Staff</span>
      <span>Műveletek</span>
    </div>
    <div class="table-row">
      <div>
        <strong>Tulajdonos 01</strong>
        <span class="sub">owner01@email.com</span>
      </div>
      <div>Példa cég 01</div>
      <div>12</div>
      <div class="actions">
        <button class="btn btn-ghost" type="button" (click)="onChangeOwner('Tulajdonos 01')">Tulajdonos csere</button>
        <button class="btn btn-outline" type="button" (click)="onViewStaff('Példa cég 01')">Staff lista</button>
        <button
          class="icon-danger-btn"
          type="button"
          (click)="openOwnerActionMenu('Tulajdonos 01', 'Példa cég 01')"
          aria-label="Tulajdonos műveletek"
          title="Tulajdonos műveletek"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v8h-2V9zm4 0h2v8h-2V9zM7 9h2v8H7V9zm1 12h8a2 2 0 0 0 2-2V9H6v10a2 2 0 0 0 2 2z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  @if (isOwnerActionModalOpen) {
    <div class="action-modal-backdrop" (click)="closeOwnerActionMenu()">
      <section class="action-modal" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Tulajdonos admin műveletek">
        <header class="action-modal-header">
          <h2>{{ selectedOwner }} kezelése</h2>
          <button class="modal-close-btn" type="button" (click)="closeOwnerActionMenu()" aria-label="Bezárás">✕</button>
        </header>
        <p class="action-modal-subtitle">Tulajdonos admin opciók a(z) {{ selectedOwnerCompany }} céghez:</p>

        <div class="action-options">
          <button class="action-option option-warn" type="button" (click)="onSuspendOwner(selectedOwner)">
            <span class="option-title">Ideiglenes felfüggesztés</span>
            <span class="option-text">Belépés korlátozása a tulajdonosi jogosultságokkal együtt.</span>
          </button>

          <button class="action-option option-muted" type="button" (click)="onRevokeOwnerAccess(selectedOwner)">
            <span class="option-title">Tulajdonosi jogkör visszavonása</span>
            <span class="option-text">Átállítja a fiókot korlátozott admin státuszra.</span>
          </button>

          <button class="action-option option-muted" type="button" (click)="onForceOwnerSecurityReview(selectedOwner)">
            <span class="option-title">Biztonsági felülvizsgálat</span>
            <span class="option-text">Kötelező hitelesítés és aktivitásellenőrzés indul.</span>
          </button>

          <button class="action-option option-muted" type="button" (click)="onTransferOwnerAssets(selectedOwner, selectedOwnerCompany)">
            <span class="option-title">Eszközök átadása</span>
            <span class="option-text">Foglalások, staff és beállítások átadása kijelölt adminnak.</span>
          </button>

          <button class="action-option option-danger" type="button" (click)="onDisableOwner(selectedOwner)">
            <span class="option-title">Végleges letiltás</span>
            <span class="option-text">A tulajdonos minden céges hozzáférése megszűnik.</span>
          </button>
        </div>
      </section>
    </div>
  }
</section>
